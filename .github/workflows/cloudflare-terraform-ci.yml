name: Cloudflare Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "pose-est-infra/cloudflare/**"
    paths-ignore:
      - "**.md"
      - "**/docs/**"

env:
  TF_WORKING_DIR: "pose-est-infra/cloudflare/terraform"

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest
    # PR にコメントを投稿するために書き込み権限が必要
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Terraform CLI のセットアップ
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      # TFLint のセットアップ (Terraform 用リンター)
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      # コードフォーマットのチェック
      # エラーがあっても処理を継続し、後続のステップでまとめて報告する
      # Terraform Format Check
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Terraform Plugin Cache
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # TFLint Plugin Cache
      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('**/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-

      # Terraform の初期化
      # バックエンド (R2) への接続情報を動的に注入
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 設定ファイルの構文検証
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # TFLint の初期化 (プラグインのインストールなど)
      - name: Init TFLint
        run: tflint --init

      # TFLint の実行
      - name: Run TFLint
        id: tflint
        run: tflint --chdir=. --format=compact
        continue-on-error: true

      # 実行計画 (Plan) の作成
      # 変更内容を確認するため、tfplan ファイルに出力
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      # Plan 結果や各ステップのステータスを PR にコメントとして投稿
      # 既存の Bot コメントがあれば更新し、なければ新規作成する
      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Terraform CI Summary')
            );

            const output = `## Terraform CI Summary

            | Step | Status |
            |------|--------|
            | 🖌 Format | \`${{ steps.fmt.outcome }}\` |
            | ⚙️ Init | \`${{ steps.init.outcome }}\` |
            | 🔍 Validate | \`${{ steps.validate.outcome }}\` |
            | 🔧 TFLint | \`${{ steps.tflint.outcome }}\` |
            | 📋 Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

      # Plan が失敗していた場合はジョブを失敗させる
      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
