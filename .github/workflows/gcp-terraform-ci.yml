name: GCP Terraform CI

# -----------------------------------------------------------------------------
# GCP Terraform CI Workflow
# -----------------------------------------------------------------------------
# プルリクエスト作成・更新時にTerraformの検証を行うワークフローです。
#
# 主な機能:
# - コードフォーマットチェック (fmt)
# - コード検証 (validate)
# - 静的解析 (TFLint)
# - 実行計画の作成 (Plan)
# - Plan結果のPRコメントへの投稿
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
    paths:
      - "pose-est-infra/gcp/**"
    paths-ignore:
      - "**.md"
      - "**/docs/**"

env:
  TF_WORKING_DIR: "pose-est-infra/gcp/terraform"

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PRへのコメント投稿に必須
      id-token: write # Workload Identity Federation に必須

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Google Cloudへの認証 (キーレス認証)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@a1502cd9e758c50496cc9ac5308c48ae4db1d30d # v3.0.0
        with:
          terraform_version: 1.14.3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@19a52fbac37cac668ea783be6d5d5921869e5d79 # v4.1.0
        with:
          tflint_version: v0.50.3

      # フォーマットチェック
      # エラーがあっても処理を継続し、後続のステップでまとめて報告する
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Terraform初期化 (R2バックエンド)
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      # 構文検証
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # TFLint初期化と実行
      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        id: tflint
        run: tflint --chdir=. --format=compact
        continue-on-error: true

      # Plan実行
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      # Plan結果をPRにコメント
      - name: Comment Plan on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('GCP Terraform CI Summary')
            );

            const planOutput = process.env.PLAN_OUTPUT;
            const maxChars = 60000;
            const truncatedOutput = planOutput.length > maxChars 
              ? planOutput.substring(0, maxChars) + "\n... (truncated due to size limits)" 
              : planOutput;

            const output = `## GCP Terraform CI Summary

            | Step | Status |
            |------|--------|
            | 🖌 Format | \`${{ steps.fmt.outcome }}\` |
            | ⚙️ Init | \`${{ steps.init.outcome }}\` |
            | 🔍 Validate | \`${{ steps.validate.outcome }}\` |
            | 🧹 TFLint | \`${{ steps.tflint.outcome }}\` |
            | 📋 Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`terraform
            ${truncatedOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
